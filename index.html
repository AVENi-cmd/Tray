    <style>
        :root {
            --bg-page: #F8F8F6;
            --card-bg: #FFFFFF;

            --text-muted: #737373;
            --gold-accent: #C5A880;
            --border-light: rgba(0, 0, 0, 0.06);
            --radius-main: 16px;
            --shadow-soft: 0 10px 30px -8px rgba(0, 0, 0, 0.04);
            --shadow-hover: 0 20px 40px -10px rgba(0, 0, 0, 0.08);

            --success-green: #10B981;

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-page); color: var(--text-main); overflow-x: hidden; line-height: 1.6; }

        .top-ticker { background: #141414; color: #FAF5EE; overflow: hidden; padding: 9px 0; font-size: 13px; font-weight: 500; border-bottom: 1px solid rgba(197, 168, 128, 0.2); }
        .ticker-track { display: flex; width: max-content; animation: marquee 28s linear infinite; }
        .ticker-item { padding: 0 30px; display: flex; align-items: center; gap: 10px; }
        .ticker-bullet { color: var(--gold-accent); }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(50%); } }

        header { position: sticky; top: 0; z-index: 100; background: rgba(248, 248, 246, 0.92); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border-light); padding: 16px 6%; display: flex; justify-content: space-between; align-items: center; }
        .logo-wrap { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text-main); }

        .logo-text { font-family: 'Amiri', serif; font-size: 28px; font-weight: 700; }
        .cart-trigger { background: #FFF; border: 1px solid var(--border-light); padding: 8px 18px; border-radius: 30px; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: var(--shadow-soft); transition: 0.2s; }
        .cart-trigger:hover { transform: translateY(-1px); border-color: rgba(0,0,0,0.15); }
        .cart-count { background: #141414; color: #FFF; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-size: 11px; }

        .hero-section { text-align: center; padding: 50px 20px 30px; max-width: 800px; margin: 0 auto; }
        .hero-tag { display: inline-block; background: rgba(197, 168, 128, 0.15); color: #8A6D3B; font-size: 13px; font-weight: 700; padding: 5px 16px; border-radius: 30px; margin-bottom: 14px; }
        .hero-title { font-family: 'Amiri', serif; font-size: 44px; color: #141414; margin-bottom: 12px; }
        .hero-desc { color: var(--text-muted); font-size: 16px; max-width: 580px; margin: 0 auto 30px; }

        .filters-bar { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 40px; padding: 0 15px; }
        .filter-btn { background: #FFFFFF; border: 1px solid var(--border-light); padding: 9px 22px; border-radius: 30px; font-size: 14px; font-weight: 700; cursor: pointer; color: var(--text-muted); transition: 0.25s; }
        .filter-btn.active, .filter-btn:hover { background: #141414; color: #FFFFFF; border-color: #141414; }

        .products-grid { max-width: 1200px; margin: 0 auto 70px; padding: 0 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 26px; }
        .product-card { background: var(--card-bg); border-radius: var(--radius-main); border: 1px solid var(--border-light); box-shadow: var(--shadow-soft); padding: 18px; transition: 0.35s ease; display: flex; flex-direction: column; position: relative; }
        .product-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-hover); }
        .card-badge { position: absolute; top: 26px; right: 26px; background: rgba(20, 20, 20, 0.85); backdrop-filter: blur(8px); color: #FFF; font-size: 11px; font-weight: 700; padding: 5px 12px; border-radius: 20px; z-index: 2; }

        .image-container { width: 100%; height: 260px; background: #F1F1ED; border-radius: 14px; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 16px; }
        .misbaha-graphic { width: 180px; height: 210px; transition: 0.4s ease; filter: drop-shadow(0 14px 12px rgba(0, 0, 0, 0.12)); }
        .product-card:hover .misbaha-graphic { transform: scale(1.05) rotate(-2deg); }

        .product-category { font-size: 12px; font-weight: 700; color: #8A6D3B; margin-bottom: 4px; }
        .product-title { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
        .specs-pills { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
        .spec-pill { background: #F4F4F2; color: #555; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px; }
        .price-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 16px; }
        .current-price { font-size: 21px; font-weight: 900; color: #141414; }
        .old-price { font-size: 14px; color: var(--text-muted); text-decoration: line-through; }
