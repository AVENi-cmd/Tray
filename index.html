<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أثير | سبح بكلايت فاخرة</title>

  <!-- خطوط جوجل: تجوال وأميري -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,700;1,400&family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-page: #F8F8F6;
      --card-bg: #FFFFFF;
      --text-main: #181818;
      --text-muted: #707070;
      --gold-accent: #C5A880;
      --gold-hover: #B39266;
      --border-light: rgba(0, 0, 0, 0.07);
      --radius-main: 16px;
      --shadow-soft: 0 10px 25px -5px rgba(0, 0, 0, 0.04);
      --shadow-hover: 0 18px 35px -8px rgba(0, 0, 0, 0.08);
      --salla-green: #00A651;
      --salla-green-light: #EBF8F1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      overflow-x: hidden;
      line-height: 1.6;
    }

    /* الشريط الإعلاني */
    .top-ticker {
      background-color: #141414;
      color: #FAF5EE;
      overflow: hidden;
      padding: 9px 0;
      font-size: 13px;
      font-weight: 500;
      border-bottom: 1px solid rgba(197, 168, 128, 0.25);
    }

    .ticker-track {
      display: flex;
      width: max-content;
      animation: marquee 28s linear infinite;
    }

    .ticker-item {
      padding: 0 30px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ticker-bullet {
      color: var(--gold-accent);
      font-size: 10px;
    }

    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(50%); }
    }

    /* الهيدر */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(248, 248, 246, 0.95);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-bottom: 1px solid var(--border-light);
      padding: 16px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-main);
    }

    .logo-icon {
      width: 38px;
      height: 38px;
      background: #141414;
      color: var(--gold-accent);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .logo-text {
      font-family: 'Amiri', serif;
      font-size: 28px;
      font-weight: 700;
    }

    .cart-trigger {
      background: #FFFFFF;
      border: 1px solid var(--border-light);
      padding: 8px 18px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow-soft);
      transition: all 0.25s ease;
    }

    .cart-trigger:hover {
      transform: translateY(-2px);
    }

    .cart-count {
      background: #141414;
      color: #FFF;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .cart-count.bounce {
      transform: scale(1.4);
      background: var(--gold-accent);
    }

    /* الهيرو */
    .hero-section {
      text-align: center;
      padding: 50px 20px 30px;
      max-width: 800px;
      margin: 0 auto;
    }

    .hero-tag {
      display: inline-block;
      background: rgba(197, 168, 128, 0.16);
      color: #8A6D3B;
      font-size: 13px;
      font-weight: 800;
      padding: 6px 16px;
      border-radius: 30px;
      margin-bottom: 16px;
    }

    .hero-title {
      font-family: 'Amiri', serif;
      font-size: 42px;
      font-weight: 700;
      color: #141414;
      line-height: 1.25;
      margin-bottom: 14px;
    }

    .hero-desc {
      color: var(--text-muted);
      font-size: 16px;
      max-width: 600px;
      margin: 0 auto 30px;
    }

    .filters-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 40px;
      padding: 0 15px;
    }

    .filter-btn {
      background: #FFFFFF;
      border: 1px solid var(--border-light);
      padding: 8px 20px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.25s ease;
    }

    .filter-btn.active, 
    .filter-btn:hover {
      background: #141414;
      color: #FFFFFF;
      border-color: #141414;
    }

    /* شبكة المنتجات */
    .products-grid {
      max-width: 1200px;
      margin: 0 auto 70px;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 28px;
    }

    .product-card {
      background: var(--card-bg);
      border-radius: var(--radius-main);
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-soft);
      padding: 16px;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .product-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-hover);
    }

    .card-badge {
      position: absolute;
      top: 26px;
      right: 26px;
      background: rgba(20, 20, 20, 0.85);
      backdrop-filter: blur(8px);
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 20px;
      z-index: 2;
    }

    .image-container {
      width: 100%;
      height: 270px;
      background: #F2F2ED;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .misbaha-graphic {
      width: 180px;
      height: 220px;
      transition: all 0.4s ease;
      filter: drop-shadow(0 15px 15px rgba(0, 0, 0, 0.12));
    }

    .product-card:hover .misbaha-graphic {
      transform: scale(1.06) rotate(-2deg);
    }

    .product-info {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .product-category {
      font-size: 12px;
      font-weight: 700;
      color: #8A6D3B;
      margin-bottom: 4px;
    }

    .product-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .specs-pills {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .spec-pill {
      background: #F4F4F2;
      color: #555;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .price-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 16px;
    }

    .current-price {
      font-size: 20px;
      font-weight: 900;
      color: #141414;
    }

    .old-price {
      font-size: 14px;
      color: var(--text-muted);
      text-decoration: line-through;
    }

    .currency {
      font-size: 13px;
      font-weight: 700;
    }

    /* زر إضافة للسلة بنمط سلة */
    .btn-add-salla {
      width: 100%;
      background: #141414;
      color: #FFFFFF;
      border: none;
      padding: 13px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.25s ease;
      margin-top: auto;
    }

    .btn-add-salla:hover {
      background: #2E2E2E;
      transform: translateY(-2px);
    }

    .btn-add-salla.added {
      background: var(--salla-green);
    }

    /* سلة المشتريات الجانبية */
    .cart-drawer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(5px);
      z-index: 1000;
      display: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .cart-drawer {
      position: fixed;
      top: 0;
      left: 0;
      width: 420px;
      max-width: 90%;
      height: 100%;
      background: #FFFFFF;
      z-index: 1001;
      transform: translateX(-100%);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      padding: 24px;
      display: flex;
      flex-direction: column;
    }

    .cart-drawer.open {
      transform: translateX(0);
    }

    .cart-drawer-overlay.open {
      display: block;
      opacity: 1;
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-light);
    }

    .drawer-header h3 {
      font-size: 18px;
      font-weight: 800;
    }

    .close-drawer {
      background: #F4F4F2;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
    }

    /* شريط تقدم الشحن المجاني بنظام سلة */
    .free-shipping-progress {
      background: #F8F8F6;
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 12px 14px;
      margin: 16px 0;
    }

    .progress-text {
      font-size: 12.5px;
      font-weight: 700;
      color: #333;
      margin-bottom: 6px;
    }

    .progress-bar-bg {
      height: 6px;
      background: #E5E5E2;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--salla-green);
      width: 0%;
      transition: width 0.4s ease;
    }

    .cart-items-list {
      flex-grow: 1;
      overflow-y: auto;
      margin-bottom: 16px;
    }

    .cart-item-row {
      display: flex;
      gap: 14px;
      padding: 14px 0;
      border-bottom: 1px solid #EFEFEA;
      align-items: center;
    }

    .cart-item-thumb {
      width: 60px;
      height: 60px;
      background: #F2F2ED;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .cart-item-thumb svg {
      width: 44px;
      height: 52px;
    }

    .cart-item-info {
      flex-grow: 1;
    }

    .cart-item-name {
      font-size: 13.5px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .cart-item-price {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 700;
    }

    .quantity-control {
      display: flex;
      align-items: center;
      background: #F4F4F2;
      border-radius: 8px;
      padding: 3px;
      gap: 6px;
      margin-top: 6px;
      width: fit-content;
    }

    .qty-btn {
      background: #FFFFFF;
      border: 1px solid #E0E0DC;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      cursor: pointer;
      font-size: 13px;
    }

    .qty-value {
      font-size: 12.5px;
      font-weight: 800;
      padding: 0 4px;
    }

    .item-delete-btn {
      background: none;
      border: none;
      color: #B91C1C;
      cursor: pointer;
      font-size: 16px;
      padding: 6px;
    }

    .coupon-box {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .coupon-input {
      flex-grow: 1;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1.5px solid #E5E5E2;
      font-family: inherit;
      font-size: 13px;
      outline: none;
    }

    .coupon-btn {
      background: #F4F4F2;
      border: 1px solid #E0E0DC;
      padding: 0 16px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }

    .coupon-btn:hover {
      background: #141414;
      color: #FFF;
    }

    .cart-footer {
      border-top: 1px solid var(--border-light);
      padding-top: 16px;
    }

    .cart-summary-line {
      display: flex;
      justify-content: space-between;
      font-size: 13.5px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .cart-summary-total {
      display: flex;
      justify-content: space-between;
      font-size: 16px;
      font-weight: 900;
      color: #141414;
      margin: 12px 0 16px;
      border-top: 1px dashed #DDD;
      padding-top: 10px;
    }

    .btn-checkout-salla {
      width: 100%;
      background: #141414;
      color: #FFFFFF;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.25s ease;
    }

    .btn-checkout-salla:hover {
      background: #2E2E2E;
      transform: translateY(-2px);
    }

    /* نافذة إتمام الطلب الشاملة */
    .checkout-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(6px);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .checkout-modal-overlay.open {
      display: flex;
      opacity: 1;
    }

    .checkout-modal {
      background: #FFFFFF;
      border-radius: 20px;
      width: 100%;
      max-width: 650px;
      max-height: 92vh;
      overflow-y: auto;
      box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-light);
    }

    .checkout-header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      background: #FFFFFF;
      z-index: 10;
    }

    .checkout-header h3 {
      font-size: 18px;
      font-weight: 900;
    }

    .checkout-steps-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      background: #F8F8F6;
      border-bottom: 1px solid var(--border-light);
      font-size: 12px;
      font-weight: 800;
      color: var(--text-muted);
    }

    .step-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .step-item.active {
      color: #141414;
    }

    .step-num {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #141414;
      color: #FFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font      color: #FFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }

    .checkout-body {
      padding: 24px;
    }

    .checkout-block {
      background: #FAFAFA;
      border: 1px solid #ECECE8;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 20px;
    }

    .checkout-block-title {
      font-size: 14.5px;
      font-weight: 800;
      color: #141414;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 540px) {
      .form-grid-2 {
        grid-template-columns: 1fr;
      }
    }

    .checkout-input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1.5px solid #E5E5E2;
      font-family: inherit;
      font-size: 13.5px;
      outline: none;
      background: #FFFFFF;
    }

    .checkout-input:focus {
      border-color: #141414;
    }

    .shipping-methods-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    @media (max-width: 540px) {
      .shipping-methods-grid {
        grid-template-columns: 1fr;
      }
    }

    .shipping-card {
      border: 1.5px solid #E5E5E2;
      border-radius: 12px;
      padding: 12px;
      background: #FFF;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .shipping-card.selected {
      border-color: #141414;
      background: #FAF8F5;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    .ship-name {
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 3px;
    }

    .ship-time {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .ship-price {
      font-size: 13px;
      font-weight: 800;
      color: var(--salla-green);
    }

    .payment-grid-salla {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    @media (max-width: 500px) {
      .payment-grid-salla {
        grid-template-columns: 1fr;
      }
    }

    .pay-card-salla {
      border: 1.5px solid #E5E5E2;
      border-radius: 12px;
      padding: 12px;
      background: #FFF;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s;
    }

    .pay-card-salla.selected {
      border-color: #141414;
      background: #FAF8F5;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
    }

    .conditional-pay-box {
      background: #FFFFFF;
      border: 1px solid #ECECE8;
      border-radius: 12px;
      padding: 16px;
      margin-top: 12px;
    }

    .card-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .bank-transfer-info {
      font-size: 12.5px;
      color: #444;
      line-height: 1.8;
      background: #F8F8F6;
      padding: 12px;
      border-radius: 10px;
    }

    .checkout-final-summary {
      background: #FFFFFF;
      border: 1px solid #E5E5E2;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .bill-row {
      display: flex;
      justify-content: space-between;
      font-size: 13.5px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .bill-row.total {
      border-top: 1.5px dashed #DDD;
      padding-top: 12px;
      margin-top: 12px;
      font-size: 17px;
      font-weight: 900;
      color: #141414;
    }

    .btn-complete-order {
      width: 100%;
      background: #141414;
      color: #FFFFFF;
      border: none;
      padding: 16px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.25s ease;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
    }

    .btn-complete-order:hover {
      background: #2E2E2E;
      transform: translateY(-2px);
    }

    /* توست إشعار إضافة المنتج */
    .salla-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #141414;
      color: #FFFFFF;
      padding: 12px 22px;
      border-radius: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      z-index: 3000;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      font-weight: 700;
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .salla-toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast-view-cart {
      background: var(--gold-accent);
      color: #141414;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    /* شاشة نجاح الطلب */
    .order-success-screen {
      display: none;
      text-align: center;
      padding: 30px 10px;
    }

    .success-check-icon {
      width: 72px;
      height: 72px;
      background: var(--salla-green-light);
      color: var(--salla-green);
      border-radius: 50%;
      display: flex;
